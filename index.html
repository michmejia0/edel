<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-10 col-log-8">
                <div class="card shadow">
                    <div class="row g-0">
                        <div class="col-md-6 d-none d-md-block">
                            <img src="./img/miu.jpg" alt="" class="img-fluid rounded-start h-100">
                        </div>
                        <!--espacio para el formulario-->
                        <div class="col-md-6">
                            <div class="card-body p-5">
                                <h2 class="card-title text-center mb-4">Iniciar Sesion</h2>
                                <form action="">
                                    <div class="mb-3">
                                        <label for="email" class="from-label">Correo Electronico</label>
                                        <input type="email" name="email" id="" class="form-control" placeholder="correo@correo.com">
                                    </div>
                                    <div class="mb-4">
                                        <label for="password" class="from-label">Contraseña</label>
                                        <input type="password" name="password" id="" class="form-control" placeholder="******">
                                    </div>
                                    <div class="text-center mb-3">
                                        <button type="" class="btn btn-primary btn-lg"><a href="./inicio.html" class="link-light">Iniciar Sesion</a></button> 
                                    </div>
                                    <div>
                                    </div>
                                    <div class="text-center mt-4">
                                        <p class="text-muted">¿No tienes cuenta? <a href="#" class="text-decoration-none">Registrate</a></p>
                                    </div>
                                </form>
                                <button type="" class="btn btn-outline-danger btn-lg" data-bs-toggle="modal" data-bs-target="#exampleModal">
                                    <i class="bi bi-google m-2"></i> Continuar con Google
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
   <!-- Modal -->
   <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Iniciar Sesion</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Inicia sesion con tu cuenta de Google para ir a Gmail. Esta cuenta estará disponible en otras aplicaciones de google.
          </p>
        </div>
        <form action="">
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
            </div>
             <label for="inputPassword5" class="form-label">Password</label>
             <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
        </form>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary w-100"><a href="./inicio.html" class="link-light">Continuar con Google</a></button>
        </div>
      </div>
    </div>
  </div>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
